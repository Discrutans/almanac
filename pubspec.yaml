name: almanac
description: "A feature-first Flutter calendar app with local persistence."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  kalender: ^0.18.6
  intl: ^0.20.2
  timezone: ^0.11.0
  flutter_localizations:
    sdk: flutter
  go_router: ^17.3.0
  flutter_riverpod: ^2.6.1
  sqlite3: ^3.3.3
  uuid: ^4.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  rrule: ^0.2.17
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  app_links: ^6.3.3
  flutter_local_notifications: ^22.0.1
  flutter_timezone: ^5.1.0
  flutter_slidable: ^4.0.3
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  open_filex: ^4.6.0
  share_plus: ^10.1.4
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  ydb_flutter_sdk: ^0.2.2
  flutter_secure_storage: ^9.2.4

hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite3/sqlite3.c

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
