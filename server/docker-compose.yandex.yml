# Almanac API → внешняя YandexDB (Serverless или Dedicated).
#
# Быстрый старт:
#   1. cp deploy/.env.yandex.example .env.yandex   # заполнить endpoint, database, PUBLIC_ORIGIN
#   2. положить sa-key.json в server/secrets/sa-key.json
#   3. docker compose -f docker-compose.yandex.yml up --build -d
#   4. curl http://localhost:8080/health
#
# Windows: .\scripts\docker_yandex_up.ps1

services:
  almanac-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: almanac-api:yandex
    container_name: almanac-api-yandex
    restart: unless-stopped
    ports:
      - "${ALMANAC_PUBLISH_PORT:-8080}:8080"
    env_file:
      - .env.yandex
    environment:
      ALMANAC_DB_BACKEND: ydb
      ALMANAC_YDB_SERVICE_ACCOUNT_KEY_FILE: /secrets/sa-key.json
    volumes:
      - ./secrets/sa-key.json:/secrets/sa-key.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
